# Regime/taxonomy/threshold policy for the 1h signal service.
#
# Canonical runtime path (override with --taxonomy-config or $TAXONOMY_CONFIG_PATH):
#   /home/djelinux/TradingBots/trading-stack/freqtrade/user_data/regime_taxonomy.yaml
#
# This example mirrors the built-in defaults that reproduce the shipped
# behaviour. A missing file is safe (the defaults apply); an existing file is
# validated strictly. enabled_timeframes controls the prompt taxonomy gate:
# 1h is enabled, 4h must stay disabled until the P1-A exit validation passes.
#
version: '1.0'
enabled_timeframes:
- 1h
regime_thresholds:
  adx_trend: 25.0
  adx_weak: 20.0
  range_choppiness: 61.8
  high_vol_atr_pct_floor: 3.0
  high_vol_atr_multiple: 2.5
  low_vol_atr_multiple: 0.55
  low_vol_choppiness: 55.0
regime_setups:
  trend_up:
  - trend_pullback
  - breakout_retest
  - momentum_continuation
  trend_down:
  - rally_failure
  - breakdown_retest
  - momentum_short
  range:
  - range_fade_extreme
  - range_mean_reversion
  low_vol: []
  high_vol: []
  unclear: []
setups:
  trend_pullback:
    side: long
    description: orderly pullback to SMA20/structure support in an uptrend with a
      rejection close
    entry: orderly pullback to SMA20/structure support in an uptrend with a rejection
      close
    invalidation: invalidated below the pullback low
    regimes:
    - trend_up
    sl_atr: 2.5
    tp_atr: 4.5
    max_hold_bars: 24
    trail_atr: 0.0
    be_at_r: 0.0
  breakout_retest:
    side: long
    description: break of a 20-bar high/range then a held retest of the broken level
    entry: break of a 20-bar high/range then a held retest of the broken level
    invalidation: invalidated back below that level
    regimes:
    - trend_up
    sl_atr: 2.5
    tp_atr: 4.5
    max_hold_bars: 24
    trail_atr: 0.0
    be_at_r: 0.0
  momentum_continuation:
    side: long
    description: higher-high/higher-low continuation without >2 ATR extension from
      SMA20
    entry: higher-high/higher-low continuation without >2 ATR extension from SMA20
    invalidation: invalidated by a lower low
    regimes:
    - trend_up
    sl_atr: 2.5
    tp_atr: 4.0
    max_hold_bars: 12
    trail_atr: 0.0
    be_at_r: 0.0
  rally_failure:
    side: short
    description: rally into SMA20/resistance rejected with a lower high in a downtrend
    entry: rally into SMA20/resistance rejected with a lower high in a downtrend
    invalidation: invalidated above the swing high
    regimes:
    - trend_down
    sl_atr: 2.5
    tp_atr: 4.5
    max_hold_bars: 24
    trail_atr: 0.0
    be_at_r: 0.0
  breakdown_retest:
    side: short
    description: support break then a rejected retest of the broken level
    entry: support break then a rejected retest of the broken level
    invalidation: invalidated back above it
    regimes:
    - trend_down
    sl_atr: 2.5
    tp_atr: 4.5
    max_hold_bars: 24
    trail_atr: 0.0
    be_at_r: 0.0
  momentum_short:
    side: short
    description: lower-high/lower-low continuation without >2 ATR extension
    entry: lower-high/lower-low continuation without >2 ATR extension
    invalidation: invalidated by a higher high
    regimes:
    - trend_down
    sl_atr: 2.5
    tp_atr: 4.0
    max_hold_bars: 12
    trail_atr: 0.0
    be_at_r: 0.0
  range_fade_extreme:
    side: both
    description: fade a wick beyond the range boundary that closes back inside
    entry: fade a wick beyond the range boundary that closes back inside
    invalidation: invalidated beyond the boundary
    regimes:
    - range
    sl_atr: 2.0
    tp_atr: 2.5
    max_hold_bars: 10
    trail_atr: 0.0
    be_at_r: 0.0
  range_mean_reversion:
    side: both
    description: return toward mid/VWAP after an excursion
    entry: return toward mid/VWAP after an excursion
    invalidation: invalidated by a break of the range
    regimes:
    - range
    sl_atr: 2.0
    tp_atr: 2.5
    max_hold_bars: 10
    trail_atr: 0.0
    be_at_r: 0.0
pair_overrides: {}
jev:
  bias_short_only: true
  log_decisions: false
  log_path: /home/djelinux/TradingBots/trading-stack/freqtrade/user_data/jev_decisions.jsonl
